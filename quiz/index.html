<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Study Quiz — Subject Select</title>
<link rel="stylesheet" href="quiz.css">
<style>
  .subject-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    margin-top: 1.5rem;
  }
  .subject-btn {
    display: block;
    padding: 18px 32px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--primary);
    font-size: 16px;
    font-weight: 500;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    text-decoration: none;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s, transform 0.1s;
    min-width: 180px;
    text-align: center;
  }
  .subject-btn:hover {
    background: #e0f4f2;
    border-color: var(--accent);
    color: var(--accent);
    transform: translateY(-2px);
  }
  .subject-btn .sub-label {
    display: block;
    font-size: 12px;
    font-weight: 400;
    color: var(--muted);
    margin-top: 4px;
  }
  .subject-btn:hover .sub-label {
    color: var(--accent);
  }
  .intro {
    font-size: 15px;
    color: var(--muted);
    margin-top: 0.5rem;
    margin-bottom: 0.5rem;
  }
</style>
</head>
<body>
<div class="quiz-wrap">
  <h1>Study Quiz</h1>
  <p class="intro">Press the appropriate subject button to begin your quiz.</p>

  <div class="subject-grid">

    <a href="quiz.html?src=rfquiz.js" target="_top" class="subject-btn">
      📡 RF Fundamentals
      <span class="sub-label">42 questions</span>
    </a>

    <a href="quiz.html?src=netquiz.js" target="_top" class="subject-btn">
      🌐 Network+
      <span class="sub-label">47 questions</span>
    </a>

    <a href="quiz.html?src=daiquiz.js" target="_top" class="subject-btn">
      💻 JavaScript / DAI
      <span class="sub-label">56 questions</span>
    </a>

    <!-- Add new subjects below this line:
    <a href="quiz.html?src=ttcquiz.js" target="_top" class="subject-btn">
      🛰️ TT&C
      <span class="sub-label">35 questions</span>
    </a>
    <a href="quiz.html?src=bjquiz.js" target="_top" class="subject-btn">
      🃏 Blackjack
      <span class="sub-label">35 questions</span>
    </a>
    -->

  </div>
</div>
</body>
</html>
