<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Study Quiz</title>
<link rel="stylesheet" href="quiz.css">
</head>
<body>
<div class="quiz-wrap">
  <h1>Study Quiz</h1>
  <div class="cat-bar" id="catBar"></div>
  <div class="score-bar">
    <div class="sc">Question <span id="qNum">1</span> of <span id="qTotal">0</span></div>
    <div class="sc">Score <span id="scTotal">0</span></div>
    <div class="sc">Got it <span id="scCorrect">0</span></div>
    <div class="sc">Partial <span id="scPartial">0</span></div>
    <div class="sc">Missed <span id="scWrong">0</span></div>
  </div>
  <div class="qcard">
    <div class="qtag" id="qCat"></div>
    <div class="qtext" id="qText">Loading…</div>
    <div class="abox" id="aBox"></div>
  </div>
  <div class="controls">
    <button id="btnReveal" onclick="reveal()">Reveal answer</button>
    <button id="btnCorrect" class="btn-correct hide" onclick="mark(2)">Got it ✓ (2)</button>
    <button id="btnPartial" class="btn-partial hide" onclick="mark(1)">Partial ~ (1)</button>
    <button id="btnWrong"   class="btn-wrong hide"   onclick="mark(0)">Missed it ✗ (0)</button>
    <button id="btnNext"    class="hide"              onclick="next()">Next →</button>
    <button class="btn-right" onclick="shuffle()">Shuffle</button>
  </div>
</div>
<script src="daiquiz.js"></script>
</body>
</html>
